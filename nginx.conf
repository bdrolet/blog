server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # Astro fingerprints all assets under /_astro/ — safe to cache permanently
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # RSS and sitemap: short cache
    location ~* \.xml$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # HTML: always revalidate
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Try exact path, then Astro's directory-style index.html, then flat .html
    location / {
        try_files $uri $uri/index.html $uri.html =404;
    }

    error_page 404 /404.html;
}
